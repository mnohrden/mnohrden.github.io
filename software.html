<style>body{font-family:"Times New Roman",Times,serif;font-size:12pt;line-height:1.4;margin:0 auto;max-width:42em;padding:12px 16px;color:#000;background:#fff}

<style id="theme">
:root{color-scheme:light;--bg:#fff;--fg:#000;--link:#0000ee;--visited:#551a8b;--rule:#000}
:root[data-theme=dark]{color-scheme:dark;--bg:#111;--fg:#e8e8e8;--link:#8ab4f8;--visited:#c58af9;--rule:#888}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#111;--fg:#e8e8e8;--link:#8ab4f8;--visited:#c58af9;--rule:#888}}
html,body{background:var(--bg);color:var(--fg)}a{color:var(--link)}a:visited{color:var(--visited)}
.r h2{border-bottom-color:var(--rule)}hr{border-color:var(--rule)}
.top{display:flex;justify-content:flex-end;align-items:flex-start;gap:14px}
.top details{position:relative}.top details ul{position:absolute;right:0;top:100%;margin:4px 0 0;padding:6px 14px 6px 1.6em;background:var(--bg);border:1px solid var(--rule);white-space:nowrap;z-index:9}
#tt{font:inherit;font-size:.85em;background:none;color:var(--fg);border:1px solid var(--rule);border-radius:4px;padding:2px 8px;margin-top:4px;cursor:pointer}
@media print{.top{display:none}}
</style>
